# ASCP (Pixelify-AOSP 17) for Pixel 8 (shiba). Read by scripts/*.sh.
ROM_NAME="ASCP (Pixelify-AOSP)"
MANIFEST_URL=https://github.com/Pixelify-AOSP/platform_manifest
MANIFEST_BRANCH=17
LUNCH_TARGET=ascp_shiba-cp2a      # lunch ${LUNCH_TARGET}-${VARIANT}
MAKE_TARGET=bacon
DEFAULT_VARIANT=userdebug
KEYS_DIR=vendor/custom-priv/keys
KEYS_TEMPLATE=https://github.com/ProjectInfinity-X/vendor_infinity-priv_keys-template
KERNEL_DIR=device/google/shusky-kernels/6.1
